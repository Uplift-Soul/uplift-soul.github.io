name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new deploy cancels any in-flight/queued one instead of piling up behind it,
# so the frequent Pi data-pushes can't jam the deploy queue.
concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs: when deploy-pages runs in the same job right
# after the upload, its artifact lookup can come back empty ("No artifacts named
# github-pages") - actions/deploy-pages#451, frequent since Nov 2026. The job
# handover gives the artifact time to register.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # publish only the site itself - repo docs (README, CHANGELOG, LICENSE)
      # stay on GitHub and are not served on the website
      - name: Assemble site
        run: |
          mkdir _site
          cp -r *.html *.json assets CNAME robots.txt sitemap.xml _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
